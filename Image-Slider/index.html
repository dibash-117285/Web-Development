<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Image Slider</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <h1 class="page-title">Image slider</h1>

    <section class="slider" id="gallery" aria-roledescription="carousel" aria-label="Photo gallery">
      <div class="slider__viewport">
        <div class="slider__track">
          <figure class="slider__slide"><img src="./img/1.jpg"alt="Mountain lake under a clear sky" /></figure>
          <figure class="slider__slide"><img src="./img/2.jpg"River winding through a green valley" /></figure>
          <figure class="slider__slide"><img src="./img/3.jpg"Waterfall dropping into a forest pool" /></figure>
          <figure class="slider__slide"><img src="./img/4.jpg"Sunlit trees along a quiet path" /></figure>
          <figure class="slider__slide"><img src="./img/5.jpg"Snowy peaks above a pine forest" /></figure>
        </div>

        <button class="slider__btn slider__btn--prev" type="button" aria-label="Previous slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button class="slider__btn slider__btn--next" type="button" aria-label="Next slide">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
        </button>
      </div>

      <div class="slider__dots" aria-label="Choose a slide"></div>
    </section>
  </main>

  <script src="slider.js" defer></script>
</body>
</html>
